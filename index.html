<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b4cf0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="我的故事词汇学习器">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>我的故事词汇学习器</title>
  <style>
    :root{--bg:#f5f6fb;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#e5e7eb;--brand:#5b4cf0;--soft:#efedff;--good:#087443;--goodbg:#ecfdf3;--bad:#b42318;--badbg:#fff1f0;--shadow:0 8px 26px rgba(33,39,74,.08)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{padding-bottom:calc(82px + env(safe-area-inset-bottom))}button,input{font:inherit}.app{max-width:620px;margin:auto;min-height:100vh}
    .top{position:sticky;top:0;z-index:20;background:rgba(245,246,251,.94);backdrop-filter:blur(14px);padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid rgba(229,231,235,.75)}.titlebar{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:20px;font-weight:900}.small{font-size:12px;color:var(--muted)}.groups{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}.groups::-webkit-scrollbar{display:none}
    .story-strip{display:flex;gap:8px;min-width:100%}.story-option{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:999px;font-weight:800;color:#374151;display:flex;align-items:center;justify-content:center;gap:5px;flex:1;min-width:0}.story-option.active{background:var(--brand);color:#fff;border-color:var(--brand)}.story-check{color:var(--good);font-size:18px}.story-option.active .story-check{color:#fff}.story-more-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;color:var(--muted);font-weight:800}.story-list{display:none;gap:8px;margin-top:8px;grid-template-columns:repeat(2,minmax(0,1fr))}.story-list.open{display:grid}.story-list .story-option{min-width:0;border-radius:12px}
    main{padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#fff 0%,#f1efff 100%)}.hero-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.h1{font-size:23px;font-weight:950;line-height:1.25;margin:0}.english-title{margin-top:4px;color:var(--muted);font-size:14px}.story-complete{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--goodbg);color:var(--good);font-size:24px;font-weight:950}.story{font-size:16px;line-height:1.9}.story b{color:#4338ca;background:#efedff;padding:1px 4px;border-radius:6px}.story-word{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px}
    .wordcard{padding:16px;cursor:pointer}.wordhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.en{font-size:22px;font-weight:950}.zh{font-weight:900;color:var(--brand);text-align:right}.hook{margin-top:8px;font-weight:760;line-height:1.6}.wordextra{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;line-height:1.75}.back-story{margin-top:12px;border:0;border-radius:10px;padding:8px 11px;background:var(--soft);color:var(--brand);font-weight:800;cursor:pointer}
    .nav{position:fixed;z-index:30;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.navin{max-width:620px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.navbtn{border:0;background:transparent;border-radius:13px;padding:7px 3px;color:#6b7280;font-size:12px;font-weight:800}.navbtn span{display:block;font-size:21px;margin-bottom:2px}.navbtn.active{background:var(--soft);color:var(--brand)}.screen{display:none}.screen.active{display:block}
    .recall-overlay{position:fixed!important;inset:0;z-index:100;display:block!important;pointer-events:none;background:transparent}.recall-panel{pointer-events:auto;position:fixed;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));width:min(340px,calc(100vw - 24px));height:min(360px,42vh);min-width:260px;min-height:170px;max-width:calc(100vw - 24px);max-height:calc(100vh - 100px);resize:both;overflow:auto;margin:0;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 36px rgba(23,32,51,.28)}.recall-panel-head{display:flex;justify-content:flex-end;align-items:center;gap:6px}.recall-toolbar{display:flex;gap:6px}.recall-tool{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--brand);padding:6px 10px;font-size:14px;font-weight:800}.recall-close{border:1px solid var(--line);border-radius:50%;width:30px;height:30px;background:#fff;color:var(--muted);font-size:18px}.recall-list{display:grid;gap:6px;margin-top:10px}.recall-row{display:grid;grid-template-columns:minmax(112px,.8fr) minmax(0,1fr);gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}.recall-row .en{font-size:16px;white-space:nowrap}.recall-row input{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}.recall-answer{grid-column:1 / -1;color:var(--good);font-size:13px}.recall-tip{font-size:12px;color:var(--muted);margin:6px 0}
    .recallbox{text-align:center;padding:24px 18px}.bigword{font-size:34px;font-weight:950;margin:10px 0 18px}.qnum{font-size:13px;color:var(--muted);font-weight:800}.question{font-size:21px;line-height:1.55;font-weight:900;margin:10px 0 18px}.opt{width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:15px;padding:14px 15px;margin:7px 0;font-size:16px}.opt.correct{border-color:#70c99a;background:var(--goodbg);color:var(--good);font-weight:800}.opt.wrong{border-color:#ed9b94;background:var(--badbg);color:var(--bad)}.feedback{margin-top:12px;border-radius:13px;padding:12px 13px;line-height:1.65;font-size:14px;display:none}.feedback.show{display:block}.feedback.good{background:var(--goodbg);color:var(--good)}.feedback.bad{background:var(--badbg);color:var(--bad)}
    .wordsea-grid{display:flex;flex-wrap:wrap;gap:9px}.wordsea-tip,.pack-help{color:var(--muted);font-size:13px;line-height:1.6}.wordsea-section{margin-top:20px}.wordsea-section h3{margin:0 0 10px}.wordsea-chip{border:0;border-radius:999px;padding:10px 13px;background:#f3f4f6;color:var(--ink);font-weight:800;cursor:pointer}.wordsea-chip.flipped{background:var(--soft);color:var(--brand)}.wordsea-chip .sea-meaning{display:none}.wordsea-chip.flipped .sea-word{display:none}.wordsea-chip.flipped .sea-meaning{display:inline}.wordsea-chip.pending{background:#f8fafc;color:#475569}
    .pack-card{padding:16px}.pack-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.pack-head h2{margin:2px 0 5px;font-size:20px}.pack-count{border-radius:999px;background:var(--soft);color:var(--brand);padding:7px 10px;font-size:12px;font-weight:900;white-space:nowrap}.pack-actions{display:flex;gap:8px;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:900;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:#374151}.btn:disabled{opacity:.45;cursor:not-allowed}.pack-pending{margin-top:10px;padding:10px 12px;border-radius:12px;background:#f8f8ff;color:var(--brand);font-size:13px}.pack-message{margin-top:9px;font-size:13px;color:var(--good)}.pack-message.bad{color:var(--bad)}.pack-choice{display:flex;gap:8px;margin-top:8px}.pack-choice .btn{flex:1}
    .install{display:none;background:#111827;color:#fff;border-radius:16px;padding:14px 15px;margin-bottom:14px;font-size:13px}.install.show{display:block}.install button{float:right;border:0;background:#fff;color:#111827;padding:7px 10px;border-radius:10px;font-weight:850}button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
    @media(max-width:450px){.story-strip{gap:6px}.story-option{padding:9px 7px;font-size:14px}.story-list{grid-template-columns:1fr}.recall-toolbar{gap:4px}.recall-tool{padding:6px 7px;font-size:12px}.pack-actions{flex-wrap:wrap}.pack-actions .btn{flex:1 1 45%}}@media(min-width:621px){.nav{left:50%;right:auto;width:620px;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line)}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top"><div class="titlebar"><div><div class="brand">我的故事词汇学习器</div><div class="small">导入你的故事包 · 阅读 → 回忆 → Quiz</div></div><div id="scoreBadge" class="small"></div></div><div id="groups" class="groups"></div></header>
    <main><div id="installBox" class="install"><button id="installBtn">安装</button><b>添加到主屏幕</b><br><span>安装后可独立窗口打开，并支持离线复习。</span></div><section id="study" class="screen active"></section><section id="recall" class="screen"></section><section id="quiz" class="screen"></section><section id="progress" class="screen"></section></main>
  </div>
  <nav class="nav"><div class="navin"><button class="navbtn active" data-screen="study"><span>📖</span>学习</button><button class="navbtn" data-screen="recall"><span>✍️</span>回忆</button><button class="navbtn" data-screen="quiz"><span>🎯</span>测试</button><button class="navbtn" data-screen="progress"><span>🌊</span>词海</button></div></nav>
  <script src="sample-pack.js"></script><script src="app.js"></script>
</body>
</html>
